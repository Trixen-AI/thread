# Netlify — the MESH web app.
#
# Netlify serves the built front end. It does NOT run the API: `server/` keeps a
# SQLite database and holds a WebSocket open for messages, and neither survives
# on a static host or in a serverless function. Deploy `server/` somewhere that
# can hold a process and a disk, then point VITE_API_URL at it.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# MESH is a single-page app: the router owns /launchpad, /t/:address and the
# rest. Without this, a reload on any route asks Netlify for a file that was
# never built and gets a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Optional: proxy the API through this domain ──────────────────────────────
#
# Set VITE_API_URL instead and the browser talks to the API directly — simpler,
# and the only option that works for the WebSocket, which Netlify cannot proxy.
#
# Use this block only if you want /api on the same domain (no CORS setup on the
# server). Messages will still need VITE_API_URL for the socket. Uncomment and
# replace the host, and keep it ABOVE the SPA rule above.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-api-host.example.com/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so a changed file is a new URL.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
